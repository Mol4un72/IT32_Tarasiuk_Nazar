<div class="movies-page">

  <h2>Список фільмів</h2>

  <p class="counter">
    Всього фільмів: {{ movies.length }}
  </p>

  <div class="form">

    <h3>Додати новий фільм</h3>

    <label>
      Назва:

      <input
        type="text"
        [(ngModel)]="newTitle"
        placeholder="Введіть назву фільму"
      >
    </label>

    <label>
      Рік:

      <input
        type="number"
        [(ngModel)]="newYear"
        placeholder="Введіть рік"
      >
    </label>

    <label>
      Рейтинг:

      <input
        type="number"
        min="1"
        max="10"
        [(ngModel)]="newRating"
        placeholder="Від 1 до 10"
      >
    </label>

    <button
      (click)="addMovie()"
      [disabled]="newTitle.trim() === ''"
    >
      Додати фільм
    </button>

  </div>

  <div class="movies">

    <div
      class="movie"
      *ngFor="let movie of movies; let i = index"
      [ngClass]="getRatingClass(movie.rating)"
    >

      <h3>{{ movie.title }}</h3>

      <p>
        Рік: {{ movie.year }}
      </p>

      <p>
        Рейтинг: {{ movie.rating }}/10
      </p>

      <p
        class="recommended"
        *ngIf="movie.rating >= 8"
      >
        Рекомендовано
      </p>

      <div class="buttons">

        <a
          class="details-button"
          [routerLink]="['/movie', movie.id]"
        >
          Переглянути деталі
        </a>

        <button
          class="delete-button"
          (click)="deleteMovie(i)"
        >
          Видалити
        </button>

      </div>

    </div>

  </div>

</div>
